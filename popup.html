<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="src/popup/popup.css">
</head>
<body>
    <div class="header">
        <h3 data-i18n="appTitle">MAL Highlighter</h3>
        <div class="tabs">
            <button class="tab-btn active" data-tab="tab-profile" data-i18n="tabProfile">Profile</button>
            <button class="tab-btn" data-tab="tab-monitor" data-i18n="tabMonitor">Monitor</button>
            <button class="tab-btn" data-tab="tab-notifications" data-i18n="tabHistory">History</button>
            <button class="tab-btn" data-tab="tab-settings" data-i18n="tabSettings">Settings</button>
        </div>
    </div>

    <div class="content">
        <div id="tab-profile" class="tab-pane active">
            <div class="input-group">
                <label data-i18n="lblUsername">MyAnimeList Username:</label>
                <input type="text" id="username" placeholder="e.g. marcio756">
            </div>
            <button id="saveBtn" class="action-btn" data-i18n="btnVerifySave">Verify & Save</button>
            
            <div id="profileArea" class="profile-area">
                <img id="avatar" class="avatar" src="" alt="Profile">
                <div class="welcome" id="welcomeText"></div>
            </div>
            <div id="statusProfile" class="status"></div>
        </div>

        <div id="tab-monitor" class="tab-pane">
            <div class="monitor-info" data-i18n="infoMonitor"></div>
            <div class="input-group">
                <label data-i18n="lblMonitorUrl">Site URL to Monitor:</label>
                <input type="text" id="monitorUrl" placeholder="https://example.com/latest">
            </div>
            <div class="input-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="monitorEnabled" style="width: auto;">
                <label for="monitorEnabled" style="margin: 0; cursor: pointer;" data-i18n="lblEnableMonitor">Enable Background Monitoring</label>
            </div>
            <button id="saveMonitorBtn" class="action-btn" data-i18n="btnSaveSettings">Save Settings</button>
            <div id="statusMonitor" class="status"></div>
        </div>

        <div id="tab-notifications" class="tab-pane">
            <div id="notifContainer">
                <ul id="notificationList" class="notif-list"></ul>
                <div id="emptyState" class="empty-state" style="display:none;" data-i18n="emptyHistory"></div>
            </div>
            
            <div class="clear-btn-container">
                <button id="clearNotifsBtn" class="action-btn btn-danger" data-i18n="btnClearHistory">Clear History</button>
            </div>
        </div>

        <div id="tab-settings" class="tab-pane">
            <div class="input-group">
                <label data-i18n="lblLanguage">Extension Language:</label>
                <select id="langSelect">
                    <option value="en" data-i18n="langEn">English</option>
                    <option value="pt" data-i18n="langPt">Português</option>
                </select>
            </div>

            <div class="input-group" style="display: flex; align-items: center; gap: 8px; margin-top: 15px;">
                <input type="checkbox" id="panelEnabled" style="width: auto;" checked>
                <label for="panelEnabled" style="margin: 0; cursor: pointer;" data-i18n="lblEnablePanel">Show Floating Panel</label>
            </div>
            <div class="input-group" style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
                <input type="checkbox" id="panelTransparent" style="width: auto;">
                <label for="panelTransparent" style="margin: 0; cursor: pointer;" data-i18n="lblEnableTransparency">Transparent Panel</label>
            </div>
            <div class="input-group" style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
                <input type="checkbox" id="savePanelPos" style="width: auto;">
                <label for="savePanelPos" style="margin: 0; cursor: pointer;" data-i18n="lblSavePanelPos">Save Panel Drag Position</label>
            </div>

            <div class="input-group" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                <label data-i18n="lblHighlights">Statuses to Highlight:</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;">
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;"><input type="checkbox" class="hl-status" value="1" checked> <span data-i18n="statusWatching">Watching</span></label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;"><input type="checkbox" class="hl-status" value="2" checked> <span data-i18n="statusCompleted">Completed</span></label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;"><input type="checkbox" class="hl-status" value="3" checked> <span data-i18n="statusOnHold">On Hold</span></label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;"><input type="checkbox" class="hl-status" value="4" checked> <span data-i18n="statusDropped">Dropped</span></label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;"><input type="checkbox" class="hl-status" value="6" checked> <span data-i18n="statusPlanned">Planned</span></label>
                </div>
            </div>

            <button id="saveSettingsBtn" class="action-btn" style="margin-top: 15px;" data-i18n="btnSaveSettings">Save Settings</button>
            <div id="statusSettings" class="status"></div>
        </div>
    </div>
    
    <div class="footer">Universal Version 1.6</div>
    
    <script src="src/common/i18n.js"></script>
    <script src="src/popup/ui.js"></script>
    <script src="src/popup/main.js"></script>
</body>
</html>

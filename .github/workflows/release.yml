name: Release

# Ao publicar uma tag (ex.: v1.8.0) compila, empacota e cria o GitHub Release com o zip anexado.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Check tag matches manifest version
        run: test "v$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run package
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
